[package]
name = "plico"
version = "0.1.2"
description = "A quiet, fast notes app"
authors = ["Bhavyam Misra"]
edition = "2021"

[lib]
name = "plico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"

ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.22"
zeroize = "1"
hex = "0.4"
notify = "8"
tauri-plugin-process = "2"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Globalization", "Win32_System_WinRT", "Win32_Globalization"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# password hashing is very slow unoptimised; keep the dev app's unlock quick
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
